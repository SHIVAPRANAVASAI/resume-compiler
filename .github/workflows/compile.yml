name: Compile Resume
on:
  workflow_dispatch:
    inputs:
      latex:
        description: 'LaTeX content (base64 encoded)'
        required: true
        type: string
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Write tex file
        run: echo "${{ github.event.inputs.latex }}" | base64 -d > resume.tex
      - name: Compile with pdflatex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: resume.pdf
